name: Build and Push CI Containers

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/ci-containers/**"
      - "poetry.lock"
      - ".github/workflows/ci-container-build.yml"

jobs:
  build-ci-containers:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        libc: [glibc, musl]
        arch: [aarch64, x86_64]
        include:
          - arch: aarch64
            os: ubuntu-24.04-arm
          - arch: x86_64
            os: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build and Push Images
        run: |
          echo ${GITHUB_TOKEN} | docker login -u ${{ secrets.DOCKER_REGISTRY_USERNAME }} --password-stdin ghcr.io
          make push-${{ matrix.libc }}@${{ matrix.arch }}
          docker logout ghcr.io
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: .github/ci-containers
